<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:">
  <title>Nightly Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div class="brand">
        <img src="logo.png" alt="Nightly">
        <span class="brand-word">nightly</span>
        <span class="brand-tag">LAUNCHER</span>
      </div>
      <div class="top-right">
        <div id="online-user" class="user-chip"></div>
        <div class="win-controls">
          <button class="win-btn" id="win-min" title="Minimize"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
          <button class="win-btn" id="win-max" title="Maximize"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
          <button class="win-btn win-close" id="win-close" title="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside id="sidebar">
        <nav id="nav">
          <button class="nav-item active" data-view="instances">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2.5 L19.5 7 L12 11.5 L4.5 7 Z" fill="var(--accent-2)"/><path d="M4.5 7 L12 11.5 L12 20.5 L4.5 16 Z" fill="var(--accent)"/><path d="M19.5 7 L12 11.5 L12 20.5 L19.5 16 Z" fill="var(--accent-soft)"/></svg></span>
            <span class="nav-label">Instances</span>
          </button>
          <button class="nav-item" data-view="browse">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent-2)" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.2"/><line x1="15.2" y1="15.2" x2="21" y2="21"/></svg></span>
            <span class="nav-label">Browse</span>
          </button>
          <button class="nav-item" data-view="settings">
            <span class="nav-icon">&#9881;</span>
            <span class="nav-label">Settings</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span class="app-version">nightly</span>
        </div>
      </aside>

      <main id="content">
        <section id="view-instances" class="view active">
          <div class="hero" id="instances-hero">
            <div class="hero-main">
              <div class="hero-eyebrow">NIGHTLY LAUNCHER</div>
              <h2 class="hero-title" id="hero-title">Ready to play?</h2>
              <p class="hero-sub" id="hero-sub">No instances yet. Create your first one or import a modpack to get started.</p>
              <div class="hero-actions" id="hero-actions"></div>
              <div class="hero-meta" id="hero-meta"></div>
            </div>
            <div class="hero-side" id="hero-character"></div>
          </div>

          <div class="view-header">
            <h2>Instances</h2>
            <div class="header-actions">
              <button class="btn" id="btn-import">Import Modpack</button>
              <button class="btn primary" id="btn-new">+ New Instance</button>
            </div>
          </div>
          <div id="instance-grid" class="card-grid"></div>
        </section>

        <section id="view-browse" class="view">
          <div class="view-header">
            <h2>Browse Modpacks</h2>
          </div>
          <div class="browse-toolbar">
            <div class="tabs">
              <button class="tab active" data-tab="modrinth">Modrinth</button>
              <button class="tab" data-tab="curse">CurseForge</button>
            </div>
            <div class="search-row">
              <input type="text" id="pack-search" placeholder="Search modpacks...">
              <button class="btn" id="btn-search">Search</button>
            </div>
          </div>
          <div id="pack-grid" class="card-grid"></div>
          <div class="pager" id="pack-pager"></div>
        </section>

        <section id="view-settings" class="view">
          <div class="view-header"><h2>Settings</h2></div>
          <div class="settings-grid" id="settings-form"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="progress-root"></div>

  <script src="node_modules/skinview3d/bundles/skinview3d.bundle.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
